# ============================================================
# Muduo ChatServer Cluster - Nginx 负载均衡配置
# 
# 功能说明：
# - TCP 层负载均衡（四层代理）
# - 支持多 ChatServer 实例水平扩展
# - 健康检查与故障自动转移
#
# 使用方法：
# 1. 复制到 /etc/nginx/conf.d/ 目录
# 2. 修改 upstream 中的服务器地址
# 3. nginx -t && nginx -s reload
#
# 作者: Chenxi
# 版本: v1.0
# 最后更新: 2026-08-24
# ============================================================

# ------------------------------------------------------------
# Stream 模块配置（TCP 负载均衡）
# 需要确保 Nginx 编译时包含 --with-stream 模块
# ------------------------------------------------------------
stream {

    # ========================================================
    # 上游服务器组定义（ChatServer 集群）
    # ========================================================
    upstream chat_backend {
        # 负载均衡算法：最少连接数（适合长连接场景）
        least_conn;
        
        # ----------------------------------------------------
        # ChatServer 实例列表
        # 格式: server IP:PORT [参数]
        # 
        # 参数说明：
        #   weight=N      权重，默认为1，数值越大分配越多请求
        #   max_fails=N   最大失败次数，超过后标记为不可用
        #   fail_timeout=S 失败超时时间（秒），超过后重试连接
        #   backup        标记为备用服务器，仅当主节点全部不可用时启用
        #   down          标记为永久不可用（维护模式）
        # ----------------------------------------------------
        
        # 主节点 - 实例 1（本地开发环境）
        server 127.0.0.1:8000 weight=5 max_fails=3 fail_timeout=30s;
        
        # 主节点 - 实例 2
        server 127.0.0.1:8001 weight=5 max_fails=3 fail_timeout=30s;
        
        # 主节点 - 实例 3（可扩展）
        # server 192.168.1.101:8000 weight=5 max_fails=3 fail_timeout=30s;
        
        # 主节点 - 实例 4（可扩展）
        # server 192.168.1.102:8000 weight=5 max_fails=3 fail_timeout=30s;
        
        # 备用服务器（可选）
        # server 127.0.0.1:8090 backup;
        
        # 长连接保持配置
        keepalive 32;  # 保持 32 个空闲长连接到上游服务器
        
        # 连接超时设置
        connect_timeout 5s;    # 连接上游服务器的超时时间
    }

    # ========================================================
    # 负载均衡服务器监听配置
    # ========================================================
    server {
        # 监听端口（对外暴露的服务端口）
        listen 80;
        
        # 代理转发到上游服务器组
        proxy_pass chat_backend;
        
        # ----------------------------------------------------
        # 超时时间配置（针对聊天长连接场景优化）
        # ----------------------------------------------------
        
        # 与上游服务器建立连接的超时时间
        proxy_connect_timeout 5s;
        
        # 与上游服务器的空闲超时时间（长连接建议设长一些）
        proxy_timeout 86400s;  # 24小时，适应聊天场景的长连接特性
        
        # ----------------------------------------------------
        # 网络层配置
        # ----------------------------------------------------
        
        # 启用 TCP 代理协议（传递真实客户端 IP）
        # 注意：ChatServer 需要支持 PROXY 协议解析
        # proxy_protocol on;
        
        # 缓冲区大小配置
        proxy_buffer_size 16k;     # 单次读取的缓冲区大小
    }
    
    # ========================================================
    # 可选：管理后台监控端口（内部使用）
    # ========================================================
    # server {
    #     listen 8080;
    #     proxy_pass chat_backend;
    #     
    #     # 允许的管理 IP 白名单
    #     allow 127.0.0.1;
    #     allow 192.168.1.0/24;
    #     deny all;
    # }

}

# ============================================================
# HTTP 模块配置（可选 - 用于监控面板或 API 网关）
# ============================================================
http {
    # --------------------------------------------------------
    # 健康检查端点（用于监控系统探活）
    # --------------------------------------------------------
    server {
        listen 8081;
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"chatserver-lb","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # Nginx 状态页面（需要 stub_status 模块）
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 192.168.1.0/24;  # 内网访问
            deny all;               # 拒绝外部访问
        }
    }
    
    # --------------------------------------------------------
    # 静态文件服务（可选 - 用于前端界面）
    # --------------------------------------------------------
    # server {
    #     listen 8082;
    #     root /var/www/chat-client;
    #     index index.html;
    #     
    #     # 前端路由
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #     
    #     # Gzip 压缩
    #     gzip on;
    #     gzip_types text/plain text/css application/json application/javascript text/xml;
    #     gzip_min_length 1000;
    # }
}